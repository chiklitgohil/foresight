<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foresight Fleet Heatmap</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container" style="max-width: 1400px;">
        <!-- Header -->
        <header class="glass-panel header-nav">
            <div class="logo">FORESIGHT<span>.AI</span></div>
            <nav class="nav-links">
                <a href="/">Operator View</a>
                <a href="/heatmap" class="active">Fleet Heatmap</a>
            </nav>
            <div class="header-status">
                <span id="heatmap-status">Polling fleet data...</span>
            </div>
        </header>

        <!-- Heatmap Grid -->
        <main class="glass-panel heatmap-panel">
            <div class="heatmap-header">
                <h2>Factory Floor Overview</h2>
                <div class="legend">
                    <div class="legend-item"><span class="legend-box low"></span> Healthy</div>
                    <div class="legend-item"><span class="legend-box med"></span> Warning</div>
                    <div class="legend-item"><span class="legend-box high"></span> Critical</div>
                </div>
            </div>
            
            <div id="heatmap-grid" class="heatmap-grid">
                <!-- Nodes generated by JS -->
            </div>
        </main>
    </div>

    <script src="/static/heatmap.js"></script>
</body>
</html>
